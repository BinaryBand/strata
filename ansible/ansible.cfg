[defaults]
inventory = inventory/hosts.ini
roles_path = roles
vault_password_file = vault_pass.py
# The system interpreter on every host: a play that becomes diot runs module
# code as diot, who cannot read the operator's project venv.
interpreter_python = /usr/bin/python3
inject_facts_as_vars = False

# NOTE: become_exe is deliberately NOT set globally here. The sudo-rs
# workaround it used to hold (/usr/bin/sudo.ws) is workstation-specific and is now
# scoped to workstation's host line in inventory/hosts.ini, so other hosts (e.g. nas)
# fall back to their own /usr/bin/sudo instead of a path they don't have.

[ssh_connection]
# Host keys are checked. accept-new trusts a device's key on first contact, so
# `strata device add` needs no manual ssh first, and refuses a key that changed
# afterwards -- the case where an impersonated device would otherwise be handed
# the vaulted sudo password and the synced rclone credentials. Setting ssh_args
# replaces Ansible's defaults, so the connection-sharing ones are restated.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
