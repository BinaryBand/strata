---
# Restic through throwaway rootless Podman containers as diot, for
# install_restic.yml, backup.yml and restore.yml. Callers set restic_action to
# "init", "backup" or "restore".
#
# Restic runs in a throwaway container rather than as a Quadlet unit -- it is a
# build-and-exit run, not a persistent service.
#
# The repository password reaches restic through podman's environment
# passthrough (a bare --env=RESTIC_PASSWORD in the argv forwards it) rather
# than as --env=RESTIC_PASSWORD=<value> in the argument vector, where it was
# readable via `ps`, via `podman inspect`, and in the task result printed on
# any failure. It is set on the block so every restic task inherits it;
# task-level environment: entries merge with it rather than replacing it.
- name: Require Restic credentials
  ansible.builtin.assert:
    that:
      - restic_action in ['init', 'backup', 'restore']
      - restic_repository | default('') | length > 0
      - restic_password | default('') | length > 0
      - restic_action == 'init' or backup_paths | default({}) | length > 0
    fail_msg: >-
      restic_repository and restic_password (and, to back up or restore,
      backup_paths) must be set; run this through the matching
      infrastructure runbook, which seeds the credentials into the vault and
      collects the app backup paths.

- name: Look up diot's uid and home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ diot_user }}"

- name: Run restic {{ restic_action }}
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  block:
    - name: Initialize the repository
      when: restic_action == 'init'
      block:
        - name: Ensure the repository directory exists
          # On an rclone mount the directory may not exist yet (a fresh pCloud
          # folder); podman refuses to start if a --volume source is missing.
          # Created as diot with no owner/mode args: FUSE mount permissions are
          # fixed by the mount options, and the local-path case is already
          # provisioned by guard.storage.
          become_user: "{{ diot_user }}"
          ansible.builtin.file:
            path: "{{ restic_repo_path }}"
            state: directory

        - name: Check whether the Restic repository is already initialized
          become_user: "{{ diot_user }}"
          environment:
            XDG_RUNTIME_DIR: "{{ diot_runtime_dir }}"
          no_log: true  # the repository password is injected into this task's environment
          ansible.builtin.command:
            argv: "{{ restic_argv_prefix + restic_repo_env + [restic_image, 'cat', 'config'] }}"
          register: restic_check
          changed_when: false
          failed_when: false

        - name: Initialize the Restic repository
          become_user: "{{ diot_user }}"
          environment:
            XDG_RUNTIME_DIR: "{{ diot_runtime_dir }}"
          when: restic_check.rc != 0
          no_log: true  # the repository password is injected into this task's environment
          ansible.builtin.command:
            argv: "{{ restic_argv_prefix + restic_repo_env + [restic_image, 'init'] }}"

    # Snapshots store each app under /data/<tag>, so restoring with --target=/
    # writes straight back into the bound volume.
    - name: Run restic {{ restic_action }} for each app's data directory as diot
      when: restic_action != 'init'
      become_user: "{{ diot_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ diot_runtime_dir }}"
      loop: "{{ backup_paths | dict2items | rejectattr('key', 'eq', config_tag) | list }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true  # the repository password is injected into this task's environment
      ansible.builtin.command:
        argv: >-
          {{ restic_argv_prefix
             + ['--volume=' ~ item.value ~ ':/data/' ~ item.key ~ restic_volume_opts]
             + restic_repo_env
             + [restic_image]
             + (['backup', '--tag=' ~ item.key, '/data/' ~ item.key]
                if restic_action == 'backup'
                else ['restore', 'latest', '--tag=' ~ item.key, '--target=/']) }}
      changed_when: true

    - name: Check for the controller-side config directory
      when: restic_action != 'init' and config_tag in backup_paths
      ansible.builtin.stat:
        path: "{{ backup_paths[config_tag] }}"
      register: config_dir

    # Operator-owned repo config (host_vars, group_vars, hosts.ini) is handled
    # as root, not diot: it lives in operator's checkout, outside diot's reach.
    # Only applies on the controller -- elsewhere the path does not exist and
    # the tag is skipped.
    - name: Run restic {{ restic_action }} for the operator config as root (controller only)
      when: restic_action != 'init' and config_tag in backup_paths and config_dir.stat.exists
      no_log: true  # the repository password is injected into this task's environment
      ansible.builtin.command:
        argv: >-
          {{ restic_argv_prefix
             + ['--volume=' ~ backup_paths[config_tag] ~ ':/data/' ~ config_tag ~ restic_volume_opts]
             + restic_repo_env
             + [restic_image]
             + (['backup', '--tag=' ~ config_tag, '/data/' ~ config_tag]
                if restic_action == 'backup'
                else ['restore', 'latest', '--tag=' ~ config_tag, '--target=/']) }}
      changed_when: true
