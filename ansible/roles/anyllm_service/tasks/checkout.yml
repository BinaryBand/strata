---
# Stop before anything is installed when the anyllm checkout, or the one
# service directory in it that the caller names, is missing on the
# controller. main.yml runs this first; a play that copies other files from
# the checkout before it installs a service runs it on its own with
# `tasks_from: checkout`.
#
# Required vars:
#   anyllm_service_src  directory under the checkout's services/
- name: "Find services/{{ anyllm_service_src }} in the anyllm checkout"
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ anyllm_src }}/services/{{ anyllm_service_src }}"
  register: anyllm_service_checkout

- name: Require the anyllm checkout on the controller
  ansible.builtin.assert:
    that:
      - anyllm_service_checkout.stat.isdir | default(false)
    fail_msg: >-
      {{ anyllm_src }}/services/{{ anyllm_service_src }} does not exist on the
      controller. Clone anyllm beside strata, or set anyllm_src to its path.
