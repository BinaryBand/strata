---
# Install the read-only /review monitor (services/review/ in the anyllm
# checkout at anyllm_src) as a hardened system service and serve it at the
# root of its own tailnet port, a separate origin from the agent-built site
# and /story on the site's port.
# The AnythingLLM root arrives as an extravar; the ports come from
# server_apps_defaults.
#
# The monitor listens on a Unix socket in a 0700 runtime directory, so only
# its own account and root (tailscaled) can reach it, and it serves only the
# tailnet login read below from the controller. Its code lives root-owned
# beside the data, out of the AI agent's reach. It shows everything the agent
# can see; credentials never leave it.
- name: Install the AnythingLLM /review monitor
  hosts: all
  become: true

  vars:
    anythingllm_group: anythingllm
    anythingllm_site_port: "{{ server_apps_defaults.anythingllm.site_port }}"
    anythingllm_review_port: "{{ server_apps_defaults.anythingllm.review_port }}"
    anythingllm_review_dir: "{{ anythingllm_root }}/review"
    anythingllm_review_socket: /run/anythingllm-review/review.sock

  tasks:
    - name: Require the AnythingLLM root extravar
      ansible.builtin.assert:
        that:
          - anythingllm_root | default('') | length > 0
        fail_msg: >-
          anythingllm_root must be set; run this through the
          services.enable_anythingllm_review runbook.

    # The one login the monitor serves: whoever is logged in to Tailscale on
    # the controller running this, read now so it never enters the repository.
    - name: Read the controller's tailnet login
      delegate_to: localhost
      become: false
      ansible.builtin.command: tailscale status --json
      register: anythingllm_review_controller
      changed_when: false

    - name: Select the login
      vars:
        anythingllm_review_status: "{{ anythingllm_review_controller.stdout | from_json }}"
      ansible.builtin.set_fact:
        anythingllm_review_login: >-
          {{ (anythingllm_review_status.User | default({}))
             .get(anythingllm_review_status.Self.UserID | string, {}).LoginName | default('') }}

    - name: Require a tailnet login on the controller
      ansible.builtin.assert:
        that:
          - anythingllm_review_login | length > 0
        fail_msg: >-
          The controller is not logged in to Tailscale as a user, so there is
          no login to allow. Log in with `tailscale up`, then re-run.

    - name: Read this host's tailnet name for links to the site
      ansible.builtin.command: tailscale status --json
      register: anythingllm_review_tailnet
      changed_when: false

    - name: Look up diot's uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ diot_user }}"

    - name: Install the monitor
      ansible.builtin.include_role:
        name: anyllm_service
      vars:
        anythingllm_review_uid: "{{ ansible_facts.getent_passwd[diot_user][1] }}"
        anythingllm_site_cert: "{{ (anythingllm_review_tailnet.stdout | from_json).CertDomains | default([], true) | first }}"
        anyllm_service_name: anythingllm-review
        anyllm_service_description: Read-only AnythingLLM admin monitor, on its own tailnet port
        anyllm_service_src: review
        anyllm_service_dir: "{{ anythingllm_review_dir }}"
        anyllm_service_main: review.py
        anyllm_service_files:
          - review.py
          - review_artifacts.py
          - review_builtins.json
          - review_content.py
          - review_files.py
          - review_knowledge.py
          - review_layout.py
          - review_overview.py
          - review_run.py
          - review_secrets.py
          - review_story.py
          - review_style.py
          - review_tasks.py
          - review_thread.py
          - review_tools.py
          - review_viewer.py
          - review_workspace.py
        anyllm_service_user: "{{ diot_user }}"
        anyllm_service_group: "{{ anythingllm_group }}"
        anyllm_service_unit_extra: |
          After=network.target
        anyllm_service_environment:
          - REVIEW_ROOT={{ anythingllm_root }}
          - REVIEW_LOGIN={{ anythingllm_review_login }}
          - REVIEW_SOCKET={{ anythingllm_review_socket }}
          - REVIEW_PREFIX=
          - REVIEW_SITE_URL=https://{{ anythingllm_site_cert }}:{{ anythingllm_site_port }}
          # For `systemctl --user is-active` on diot's AnythingLLM units.
          - XDG_RUNTIME_DIR=/run/user/{{ anythingllm_review_uid }}
          - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ anythingllm_review_uid }}/bus
        anyllm_service_sandbox: |
          RuntimeDirectory=anythingllm-review
          RuntimeDirectoryMode=0700
          UMask=0077
          # Read-only everywhere, no network at all (the socket is a file).
          ReadOnlyPaths={{ anythingllm_root }}
          # read-only, not yes: "yes" also hides /run/user, where diot's user
          # manager listens for the service-state check.
          ProtectHome=read-only
          PrivateNetwork=yes
          RestrictAddressFamilies=AF_UNIX

    # Mount it on the tailnet only once it answers the allowed login.
    - name: Check that the monitor answers over its socket
      ansible.builtin.uri:
        url: http://localhost/
        unix_socket: "{{ anythingllm_review_socket }}"
        headers:
          Tailscale-User-Login: "{{ anythingllm_review_login }}"
        status_code: 200
      register: anythingllm_review_health
      retries: 10
      delay: 2
      until: anythingllm_review_health.status == 200

    - name: Serve the monitor at the root of its own tailnet port
      ansible.builtin.include_role:
        name: tailscale_serve
      vars:
        tailscale_serve_port: "{{ anythingllm_review_port }}"
        tailscale_serve_backend: "unix:{{ anythingllm_review_socket }}"
