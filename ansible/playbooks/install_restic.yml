---
# Initialize a Restic repository for server app backups. restic_repo_path and
# restic_image are shared defaults in inventory/group_vars/all/restic.yml;
# restic_repository and restic_password come from the vault. The container
# plumbing is shared with backup.yml and restore.yml; see
# roles/restic_container/.
- name: Initialize the Restic backup repository
  hosts: all
  become: true

  vars:
    restic_action: init

  roles:
    - restic_container
