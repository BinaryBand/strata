---
# Deploy Baikal CalDAV/CardDAV as a rootless Podman container owned by diot,
# mirroring the Jellyfin pattern. Admin and user accounts are created
# through Baikal's web installer on first visit -- this play only stands up the
# service and its data volumes. The data root is declared with guard.path by
# install_baikal.py and passed in as an extravar; the image and published port
# come from the server_apps_defaults group_var.
- name: Deploy Baikal as a rootless Podman container owned by diot
  hosts: all
  become: true

  vars:
    baikal_group: baikal
    baikal_image: "{{ server_apps_defaults.baikal.image }}"
    baikal_http_port: "{{ server_apps_defaults.baikal.port }}"

  tasks:
    - name: Require the data directory extravar
      ansible.builtin.assert:
        that:
          - baikal_data_dir | default('') | length > 0
        fail_msg: >-
          baikal_data_dir must be set; run this through the
          services.install_baikal runbook, which owns the data directory
          layout.

    - name: Deploy and start Baikal
      ansible.builtin.include_role:
        name: podman_quadlet_service
      vars:
        quadlet_user: "{{ diot_user }}"
        quadlet_group: "{{ baikal_group }}"
        quadlet_name: baikal
        quadlet_content: |
          [Unit]
          Description=Baikal CalDAV/CardDAV server

          [Container]
          Image={{ baikal_image }}
          Volume={{ baikal_data_dir }}/config:/var/www/baikal/config:Z
          Volume={{ baikal_data_dir }}/Specific:/var/www/baikal/Specific:Z
          PublishPort={{ baikal_http_port }}:80

          [Service]
          Restart=always

          [Install]
          WantedBy=default.target
