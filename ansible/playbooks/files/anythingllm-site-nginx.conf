# nginx for the AnythingLLM agent's site, managed by strata's
# enable_anythingllm_site runbook. It lives outside the agent's writable
# folder, so the headers below hold whatever the agent writes.
server {
    listen 8080;
    # The builder publishes each build as a release and switches this link.
    root /usr/share/nginx/html/current;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    # The front page and the archive list change in place every day; make
    # browsers ask before reusing a copy (a cheap 304 when nothing changed).
    add_header Cache-Control "no-cache" always;
    # Enforced by the browser even on a page the agent wrote without its own
    # meta line; a looser meta policy cannot relax it.
    add_header Content-Security-Policy "script-src 'none'; object-src 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
