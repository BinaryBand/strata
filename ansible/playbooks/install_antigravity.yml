---
- name: Install Google Antigravity CLI via local Homebrew tap
  hosts: local

  vars:
    tap_name: mylocal/tools
    formula_file: "{{ (playbook_dir + '/../../static/homebrew-tools/Formula/antigravity.rb') | realpath }}"
    brew_bin: /home/linuxbrew/.linuxbrew/bin/brew
    antigravity_bin: /home/linuxbrew/.linuxbrew/bin/antigravity

  tasks:
    - name: Require Homebrew is already installed
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: brew_stat
      failed_when: not brew_stat.stat.exists

    - name: Ask Homebrew where the tap lives
      ansible.builtin.command:
        cmd: "{{ brew_bin }} --repository {{ tap_name }}"
      register: tap_repository
      changed_when: false

    # The tap is a plain directory, not a git repository: strata's own history
    # already versions the formula. `brew update` skips a tap that has no .git,
    # but warns "No remote 'origin' ... skipping update!" on every run for a
    # local git tap that has nothing to pull from. Earlier versions of this
    # play built the tap as a repository, so the .git is removed, not just
    # never created.
    - name: Ensure the tap is not a git repository
      ansible.builtin.file:
        path: "{{ tap_repository.stdout }}/.git"
        state: absent

    - name: Ensure the tap's Formula directory exists
      ansible.builtin.file:
        path: "{{ tap_repository.stdout }}/Formula"
        state: directory
        mode: "0755"

    - name: Copy the antigravity formula into the tap
      ansible.builtin.copy:
        src: "{{ formula_file }}"
        dest: "{{ tap_repository.stdout }}/Formula/antigravity.rb"
        mode: "0644"

    - name: Install antigravity formula from the local tap
      ansible.builtin.command:
        cmd: "{{ brew_bin }} install --build-from-source {{ tap_name }}/antigravity"
        creates: "{{ antigravity_bin }}"

    - name: Run the formula's built-in test
      ansible.builtin.command:
        cmd: "{{ brew_bin }} test {{ tap_name }}/antigravity"
      changed_when: false

    - name: Verify antigravity reports its version
      ansible.builtin.command:
        cmd: "{{ antigravity_bin }} --version"
      register: version_check
      changed_when: false

    - name: Confirm the installed version
      ansible.builtin.assert:
        that:
          - version_check.stdout is match("[0-9]+\\.[0-9]+\\.[0-9]+")
        fail_msg: >-
          antigravity --version did not return a semver string
          (got "{{ version_check.stdout }}").
