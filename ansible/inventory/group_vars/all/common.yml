---
# The account that owns the server apps' rootless containers and systemd
# --user units (created by create_diot_user.yml), and its user manager's
# runtime directory. The runtime directory resolves only after the play has
# looked the account up with ansible.builtin.getent.
diot_user: diot
diot_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[diot_user][1] }}"

