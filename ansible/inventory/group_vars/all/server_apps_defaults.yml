---
# Canonical deployment defaults for server apps.
#
# These values were previously hardcoded inside individual playbooks.  By living
# in group_vars they are (a) visible in one place, (b) referenceable by any
# playbook as {{ server_apps_defaults.<app>.<field> }}, and (c) editable per
# target via host_vars/ or per group via another group_vars file (Ansible's
# precedence ladder handles the override naturally).
#
# The schema is enforced by the Pydantic model at
# strata/core/models/server_apps_config.py -- run `strata dev schema` to regenerate
# the VS Code intellisense schema after editing this file's structure.
#
# Data directories are deliberately NOT here: they are declared with guard.path
# in the runbook that provisions them and passed to the playbook as extravars,
# so the directory a guard creates and the directory the container binds cannot
# drift apart.
server_apps_defaults:
  baikal:
    image: docker.io/ckulka/baikal:nginx
    port: 8080
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    port: 8096
  minio:
    # docker.io/minio/minio is gated behind Docker Hub auth as of 2025;
    # quay.io is MinIO's own supported public mirror.
    image: quay.io/minio/minio:latest
    port: 9000
    console_port: 9001